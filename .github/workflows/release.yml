name: Release

# Push a tag like v1.0.1 to build the app, make an installer, and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore & test
        shell: pwsh
        run: |
          dotnet test --configuration Release

      - name: Publish (self-contained, x64)
        shell: pwsh
        run: >
          dotnet publish src/RdpManager.Presentation/RdpManager.Presentation.csproj
          -c Release -r win-x64 --self-contained true
          -p:WindowsAppSDKSelfContained=true -p:WindowsPackageType=None
          -p:Version=${{ steps.ver.outputs.version }}

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: iscc /DAppVersion=${{ steps.ver.outputs.version }} installer\RdpManager.iss

      - name: Build release notes from JSON
        id: notes
        shell: pwsh
        run: |
          $ver  = "${{ steps.ver.outputs.version }}"
          $path = "release-notes/$ver.json"
          $json = $null
          if (Test-Path $path) {
            $json = Get-Content $path -Raw | ConvertFrom-Json
          } else {
            # No notes for this version (quick test bump): reuse the most recent notes.
            $latest = Get-ChildItem "release-notes/*.json" |
              Where-Object { $_.BaseName -match '^\d+(\.\d+)+$' } |
              Sort-Object { [version]$_.BaseName } -Descending |
              Select-Object -First 1
            if ($latest) { $json = Get-Content $latest.FullName -Raw | ConvertFrom-Json }
          }
          if ($json) {
            # Always show the NEW version in the title, keep the bullets.
            $title = if ($json.title -match '\d+\.\d+') { $json.title -replace '\d+\.\d+(\.\d+){0,2}', $ver } else { "Deskpin $ver" }
            $body  = "# $title`n`n"
            foreach ($item in $json.description) { $body += "* $($item.content)`n" }
          } else {
            $title = "Deskpin $ver"
            $body  = "Deskpin $ver"
          }
          Set-Content -Path release-notes.md -Value $body
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: release-notes.md
          files: installer/Output/*.exe
